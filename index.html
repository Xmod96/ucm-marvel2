:root{--bg:#090b10;--panel:#11151d;--panel2:#171c26;--text:#f5f7fb;--muted:#a8b0bf;--accent:#e62429;--accent2:#8b5cf6;--line:#252c38}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#07080c,#0c1018 55%,#080a0f);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:42px 22px 28px;max-width:1250px;margin:auto}
h1{font-size:clamp(32px,6vw,58px);margin:0 0 8px;letter-spacing:-1.5px}
.subtitle{color:var(--muted);margin:0 0 24px}
.progress-wrap{background:var(--panel);border:1px solid var(--line);padding:18px;border-radius:18px}
.progress-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px;font-weight:700}
.bar{height:10px;background:#252a34;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#ff6b6f);transition:.25s}
main{max-width:1250px;margin:auto;padding:0 22px 50px}
.controls{position:sticky;top:0;z-index:5;background:rgba(9,11,16,.9);backdrop-filter:blur(14px);padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px}
input,select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 13px}
input{flex:1;min-width:210px}button{cursor:pointer}button.active{background:var(--accent);border-color:var(--accent)}
.saga{margin:34px 0 12px}.saga h2{margin:0;font-size:28px}.saga p{color:var(--muted);margin:5px 0 0}
.phase{margin-top:28px}.phase h3{font-size:20px;margin:0 0 14px;color:#ddd}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;transition:.2s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);border-color:#394353}
.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:#1a1f28}
.body{padding:12px}.num{font-size:12px;color:var(--muted)}.title{font-weight:750;margin:4px 0 8px;line-height:1.2}.meta{font-size:12px;color:var(--muted)}
.check{display:flex;align-items:center;gap:7px;margin-top:11px;font-size:13px}.check input{min-width:0;flex:none;width:18px;height:18px}
.optional{display:inline-block;font-size:11px;margin-top:8px;padding:4px 7px;border-radius:7px;background:#2a2230;color:#f0b8f7}
.empty{padding:30px;text-align:center;color:var(--muted)}
footer{max-width:1250px;margin:auto;padding:20px 22px 50px;color:var(--muted);font-size:12px}
footer a{color:#d8b4fe}
@media(max-width:600px){header{padding-top:28px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border-radius:12px}.body{padding:10px}.title{font-size:14px}.controls{top:0}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.hidden{display:none!important}.modal-box{width:min(560px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;position:relative}.modal-box h2{margin-top:0}.modal-box input{width:100%;margin:12px 0}.modal-actions{display:flex;gap:10px;flex-wrap:wrap}.close{position:absolute;right:14px;top:10px;background:none;border:0;font-size:28px}.small{font-size:12px;color:var(--muted)}

.detail-btn{margin-top:10px;width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-weight:650}
.detail-btn:hover{border-color:#4a5568}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(8px);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal.hidden{display:none}
.modal-box{max-width:760px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 25px 80px rgba(0,0,0,.5)}
.modal-content{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:24px}
.modal-poster{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:#1a1f28}
.modal-title{font-size:28px;margin:0 0 8px}.modal-meta{color:var(--muted);margin-bottom:18px}.modal-desc{line-height:1.65;color:#d8dde7}
.modal-close{position:absolute;right:20px;top:16px;border:0;background:rgba(0,0,0,.45);color:white;font-size:28px;width:42px;height:42px;border-radius:50%;cursor:pointer}
@media(max-width:650px){.modal-content{grid-template-columns:100px 1fr;gap:14px;padding:18px}.modal-title{font-size:21px}.modal-desc{font-size:14px}}
#ratingBox{margin-top:20px}.rating-label{color:var(--muted);font-size:13px;margin-bottom:7px}.rating-star{font-size:30px;color:#555;cursor:pointer;line-height:1;margin-right:3px}.rating-star.selected{color:#ffd43b}.rating-star:hover{color:#ffd43b}
</style>

function posterFallback(title){
  return "https://placehold.co/400x600/171c26/f5f7fb?text="+encodeURIComponent(title.replace(" — ","\\n"));
}
const localPosters = {"Iron Fist — Temporada 1": "iron-fist-temporada-1.webp", "Iron Fist — Temporada 2": "iron-fist-temporada-2.webp", "Guardianes de la Galaxia: Especial Felices Fiestas": "guardianes-especial-felices-fiestas.jpg", "Marvel Zombies": "marvel-zombies.jpg", "Wonder Man — Temporada 1": "wonder-man-temporada-1.webp", "Spider-Man: Brand New Day": "spider-man-brand-new-day.webp", "The Defenders — Temporada 1": "the-defenders-temporada-1.webp"};

function posterUrl(title){
  if (posters[title]) return posters[title];
  const id=imdbIds[title];
  return id && !id.includes("?") ? "https://images.metahub.space/poster/medium/"+id+"/img" : "";
}
function getPoster(title, type, img){
  const u=posterUrl(title);
  img.onerror=()=>{img.onerror=null; img.src=posterFallback(title);};
  img.src=u || posterFallback(title);
}
function openDetails(i){
 const [sg,ph,title,type,opt]=items[i];
 const modal=document.getElementById("detailModal");
 const poster=document.getElementById("modalPoster");
 poster.src=posterUrl(title)||posterFallback(title);
 poster.onerror=()=>{poster.onerror=null;poster.src=posterFallback(title)};
 document.getElementById("modalTitle").textContent=title;
 document.getElementById("modalMeta").textContent=sg+" · "+ph+" · "+typeName(type)+(opt?" · Opcional":"");
 document.getElementById("modalDesc").textContent=descriptions[title]||"En esta historia, el personaje se enfrenta a una nueva amenaza dentro del Universo Cinematográfico de Marvel.";
  const ratingEl=document.getElementById("modalRating");
  const currentRating=ratings[title]||0;
  ratingEl.innerHTML=[1,2,3,4,5].map(n=>`<span class="rating-star ${n<=currentRating?"selected":""}" data-rating="${n}">★</span>`).join("");
  ratingEl.querySelectorAll(".rating-star").forEach(star=>{
    star.addEventListener("click",()=>{
      ratings[title]=Number(star.dataset.rating);
      localStorage.setItem("ucm-ratings",JSON.stringify(ratings));
      openDetails(i);
    });
  });
 modal.classList.remove("hidden"); modal.setAttribute("aria-hidden","false");
}
const detailModal=document.getElementById("detailModal");
document.getElementById("modalClose").addEventListener("click",()=>{detailModal.classList.add("hidden");detailModal.setAttribute("aria-hidden","true")});
detailModal.addEventListener("click",e=>{if(e.target===detailModal){detailModal.classList.add("hidden");detailModal.setAttribute("aria-hidden","true")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")detailModal.classList.add("hidden")});

function render(){
 const app=document.getElementById("app"); app.innerHTML="";
 const groups={};
 items.forEach((x,i)=>{
   const [sg,ph,title,type,opt]=x, isWatched=!!watched[i];
   const okSearch=title.toLowerCase().includes(query.toLowerCase());
   const okSaga=saga==="all" || (saga==="infinity"&&sg==="Saga del Infinito") || (saga==="Entre"&&sg==="Entre sagas") || (saga==="multiverse"&&sg==="Saga del Multiverso");
   const okFilter=filter==="all" || filter===type || (filter==="watched"&&isWatched) || (filter==="pending"&&!isWatched);
   if(okSearch&&okSaga&&okFilter){(groups[sg]??={})[ph]??=[];groups[sg][ph].push([i,...x]);}
 });
 Object.entries(groups).forEach(([sg,phases])=>{
   const sagaEl=document.createElement("section"); sagaEl.className="saga";
   sagaEl.innerHTML=`<h2>${sg}</h2><p>${sg==="Saga del Infinito"?"Fases 1–3":"Fases 4–6"}</p>`;
   Object.entries(phases).forEach(([ph,arr])=>{
     const sec=document.createElement("div");sec.className="phase";sec.innerHTML=`<h3>${ph}</h3><div class="grid"></div>`;
     const grid=sec.querySelector(".grid");
     arr.forEach(([i,sg,ph,title,type,opt])=>{
       const card=document.createElement("article");card.className="card";
       card.innerHTML=`<img class="poster" loading="lazy" src="${posterUrl(title)}" alt="Portada de ${title}" onerror="this.onerror=null;this.src=posterFallback(title)">
       <div class="body"><div class="num">#${i+1}</div><div class="title">${title}</div><div class="meta">${typeName(type)}</div>${opt?'<span class="optional">Opcional</span>':''}
       <label class="check"><input type="checkbox" ${watched[i]?"checked":""}> Vista</label>
       <button class="detail-btn" type="button">Ver descripción</button></div>`;
       card.querySelector("input").addEventListener("change",e=>{watched[i]=e.target.checked;localStorage.setItem("ucm-watched",JSON.stringify(watched));updateProgress();});
       const poster=card.querySelector(".poster"); getPoster(title, type, poster);
       card.querySelector(".detail-btn").addEventListener("click",()=>openDetails(i));
       grid.appendChild(card);
     });
     sagaEl.appendChild(sec);
   });
   app.appendChild(sagaEl);
 });
 if(!app.children.length) app.innerHTML='<div class="empty">No hay resultados con estos filtros.</div>';
 updateProgress();
}
function updateProgress(){
 const total=items.length, count=Object.values(watched).filter(Boolean).length, pct=Math.round(count/total*100);
 document.getElementById("progressText").textContent=`${count} / ${total} · ${pct}%`;
 document.getElementById("progressBar").style.width=pct+"%";
}
document.getElementById("search").addEventListener("input",e=>{query=e.target.value;render()});
document.getElementById("saga").addEventListener("change",e=>{saga=e.target.value;render()});
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));b.classList.add("active");filter=b.dataset.filter;render()}));
render();
</script>
